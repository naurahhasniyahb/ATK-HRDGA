<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservasi ATK HRD-GA</title>

    <meta name="theme-color" content="#F9DAD9">
    <link rel="apple-touch-icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpjjQ0KG8XLk69cJr3Es786wKiB3ug-v46kmbatp05O_-Lop7co52YEUvS&s=10">
    <link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpjjQ0KG8XLk69cJr3Es786wKiB3ug-v46kmbatp05O_-Lop7co52YEUvS&s=10"> 

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-[#F9DAD9] via-rose-50/50 to-[#f5c7c5] min-h-screen flex flex-col items-center justify-center p-4">
    
    <div class="bg-white/90 backdrop-blur-md w-full max-w-xl rounded-3xl shadow-xl p-6 sm:p-8 border border-[#F9DAD9] mb-4">
        
        <div class="text-center mb-6">
            <div class="flex justify-center mb-3">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpjjQ0KG8XLk69cJr3Es786wKiB3ug-v46kmbatp05O_-Lop7co52YEUvS&s=10" alt="Logo Aplikasi" class="w-16 h-16 object-contain rounded-2xl bg-[#F9DAD9]/30 p-2.5 border border-[#F9DAD9] shadow-sm">
            </div>
            <h1 class="text-xl font-bold text-slate-800 tracking-normal">Reservasi ATK</h1>
            <p class="text-xs font-medium text-rose-500 tracking-wider uppercase mt-1">HRD-GA Department</p>
        </div>

        <!-- FORM UTAMA -->
        <div id="atkForm" class="space-y-4">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Peminta</label>
                    <input type="text" id="namaPeminta" class="w-full px-4 py-2.5 bg-slate-50/70 border border-slate-200/80 rounded-xl focus:ring-2 focus:ring-[#F9DAD9] focus:bg-white outline-none transition text-slate-700 text-sm placeholder-slate-400" placeholder="Nama Lengkap">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Email Peminta</label>
                    <input type="email" id="emailPeminta" class="w-full px-4 py-2.5 bg-slate-50/70 border border-slate-200/80 rounded-xl focus:ring-2 focus:ring-[#F9DAD9] focus:bg-white outline-none transition text-slate-700 text-sm placeholder-slate-400" placeholder="email@company.com">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Departemen</label>
                    <input type="text" id="departemen" class="w-full px-4 py-2.5 bg-slate-50/70 border border-slate-200/80 rounded-xl focus:ring-2 focus:ring-[#F9DAD9] focus:bg-white outline-none transition text-slate-700 text-sm placeholder-slate-400" placeholder="Departemen">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">No Reservasi</label>
                    <input type="text" id="noReservasi" class="w-full px-4 py-2.5 bg-slate-50/70 border border-slate-200/80 rounded-xl focus:ring-2 focus:ring-[#F9DAD9] focus:bg-white outline-none transition text-slate-700 text-sm placeholder-slate-400" placeholder="No. Dokumen/Ref">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal Reservasi</label>
                    <input type="date" id="tglReservasi" class="w-full px-4 py-2.5 bg-slate-50/70 border border-slate-200/80 rounded-xl focus:ring-2 focus:ring-[#F9DAD9] focus:bg-white outline-none transition text-slate-700 text-sm">
                </div>
            </div>

            <hr class="border-[#F9DAD9] my-2">

            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider">Daftar Barang ATK (MID, Nama, UOM, Qty)</label>
                    <button type="button" onclick="tambahBaris()" class="text-xs font-semibold text-rose-600 bg-[#F9DAD9]/40 hover:bg-[#F9DAD9] px-3 py-1.5 rounded-lg border border-[#F9DAD9] transition">
                        + Tambah Barang
                    </button>
                </div>

                <div id="itemContainer" class="space-y-2.5 max-h-56 overflow-y-auto pr-1">
                    <div class="item-row flex items-center gap-2">
                        <span class="text-xs font-bold text-slate-400 w-5 text-center">1.</span>
                        <input type="text" placeholder="MID" class="mid-barang w-24 px-3 py-2 bg-slate-50/70 border border-slate-200/80 rounded-xl text-sm focus:ring-2 focus:ring-[#F9DAD9] outline-none" oninput="cariNamaBarang(this)">
                        <input type="text" placeholder="Nama Barang ATK" class="nama-barang flex-1 px-3 py-2 bg-slate-50/70 border border-slate-200/80 rounded-xl text-sm focus:ring-2 focus:ring-[#F9DAD9] outline-none">
                        <input type="text" placeholder="UOM" class="uom-barang w-16 px-2 py-2 bg-slate-50/70 border border-slate-200/80 rounded-xl text-sm text-center focus:ring-2 focus:ring-[#F9DAD9] outline-none">
                        <input type="number" value="1" min="1" placeholder="Qty" class="qty-barang w-16 px-2 py-2 bg-slate-50/70 border border-slate-200/80 rounded-xl text-sm text-center focus:ring-2 focus:ring-[#F9DAD9] outline-none">
                    </div>
                    <div class="item-row flex items-center gap-2">
                        <span class="text-xs font-bold text-slate-400 w-5 text-center">2.</span>
                        <input type="text" placeholder="MID" class="mid-barang w-24 px-3 py-2 bg-slate-50/70 border border-slate-200/80 rounded-xl text-sm focus:ring-2 focus:ring-[#F9DAD9] outline-none" oninput="cariNamaBarang(this)">
                        <input type="text" placeholder="Nama Barang ATK" class="nama-barang flex-1 px-3 py-2 bg-slate-50/70 border border-slate-200/80 rounded-xl text-sm focus:ring-2 focus:ring-[#F9DAD9] outline-none">
                        <input type="text" placeholder="UOM" class="uom-barang w-16 px-2 py-2 bg-slate-50/70 border border-slate-200/80 rounded-xl text-sm text-center focus:ring-2 focus:ring-[#F9DAD9] outline-none">
                        <input type="number" value="1" min="1" placeholder="Qty" class="qty-barang w-16 px-2 py-2 bg-slate-50/70 border border-slate-200/80 rounded-xl text-sm text-center focus:ring-2 focus:ring-[#F9DAD9] outline-none">
                    </div>
                </div>
            </div>

            <button onclick="submitATK()" id="submitBtn" class="w-full mt-4 bg-rose-400 hover:bg-rose-500 active:scale-[0.98] text-white font-semibold text-sm py-3.5 rounded-2xl shadow-md shadow-rose-400/20 transition-all duration-200">
                Kirim Reservasi
            </button>
        </div>

        <!-- HALAMAN RINCIAN / SUKSES (AWALNYA DISEMBUNYIKAN) -->
        <div id="successSummary" class="hidden space-y-4">
            <div class="text-center bg-emerald-50 border border-emerald-200 text-emerald-800 p-4 rounded-2xl">
                <div class="text-2xl mb-1">🎉</div>
                <h2 class="font-bold text-base">Reservasi Berhasil Dikirim!</h2>
                <p class="text-xs text-emerald-600 mt-0.5">Data Anda telah tercatat ke system.</p>
            </div>

            <div class="bg-slate-50/80 border border-slate-200/80 rounded-2xl p-4 text-sm space-y-2 text-slate-700">
                <div class="flex justify-between border-b border-slate-200 pb-2">
                    <span class="text-slate-500 font-medium">No. Reservasi</span>
                    <span id="sumNoReservasi" class="font-bold text-slate-800"></span>
                </div>
                <div class="flex justify-between border-b border-slate-200 pb-2">
                    <span class="text-slate-500 font-medium">Nama Peminta</span>
                    <span id="sumNama" class="font-semibold"></span>
                </div>
                <div class="flex justify-between border-b border-slate-200 pb-2">
                    <span class="text-slate-500 font-medium">Departemen / Email</span>
                    <span id="sumDeptEmail" class="text-right"></span>
                </div>
                <div class="flex justify-between pb-1">
                    <span class="text-slate-500 font-medium">Tanggal Reservasi</span>
                    <span id="sumTgl" class="font-semibold"></span>
                </div>
            </div>

            <div>
                <h3 class="text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Rincian Barang ATK yang Direservasi</h3>
                <div id="sumItemsContainer" class="border border-slate-200/80 rounded-2xl overflow-hidden text-sm divide-y divide-slate-100 max-h-48 overflow-y-auto">
                    <!-- Item rincian dinamis masuk lewat JS -->
                </div>
            </div>

            <button onclick="location.reload()" class="w-full mt-2 bg-slate-800 hover:bg-slate-900 active:scale-[0.98] text-white font-semibold text-sm py-3.5 rounded-2xl shadow-md transition-all duration-200">
                Buat Reservasi Baru
            </button>
        </div>

    </div>

    <footer class="text-center text-xs text-slate-500 font-medium">
        &copy; 2026 by HRD-GA Dept
    </footer>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwLOY5w0BMuaFyTgbiyLFeZ6YeA1NwHdzXSckEiEhFsv6JTqGWB6aDdY1N26sKFSU5U/exec";
        let masterMIDData = {};

        window.onload = function() {
            document.getElementById('tglReservasi').valueAsDate = new Date();

            fetch(WEB_APP_URL + '?action=getMasterMID')
                .then(response => response.json())
                .then(result => {
                    if (result.status === "success") {
                        masterMIDData = result.data;
                    }
                })
                .catch(err => console.log('Gagal memuat Master MID:', err));
        };

        function cariNamaBarang(inputElement) {
            const midValue = inputElement.value.trim();
            const row = inputElement.closest('.item-row');
            const namaBarangInput = row.querySelector('.nama-barang');

            if (masterMIDData[midValue]) {
                namaBarangInput.value = masterMIDData[midValue];
            } else if (midValue === "") {
                namaBarangInput.value = "";
            }
        }

        function tambahBaris() {
            const container = document.getElementById('itemContainer');
            const rowCount = container.getElementsByClassName('item-row').length + 1;

            const newRow = document.createElement('div');
            newRow.className = 'item-row flex items-center gap-2';
            newRow.innerHTML = `
                <span class="text-xs font-bold text-slate-400 w-5 text-center">${rowCount}.</span>
                <input type="text" placeholder="MID" class="mid-barang w-24 px-3 py-2 bg-slate-50/70 border border-slate-200/80 rounded-xl text-sm focus:ring-2 focus:ring-[#F9DAD9] outline-none" oninput="cariNamaBarang(this)">
                <input type="text" placeholder="Nama Barang ATK" class="nama-barang flex-1 px-3 py-2 bg-slate-50/70 border border-slate-200/80 rounded-xl text-sm focus:ring-2 focus:ring-[#F9DAD9] outline-none">
                <input type="text" placeholder="UOM" class="uom-barang w-16 px-2 py-2 bg-slate-50/70 border border-slate-200/80 rounded-xl text-sm text-center focus:ring-2 focus:ring-[#F9DAD9] outline-none">
                <input type="number" value="1" min="1" placeholder="Qty" class="qty-barang w-16 px-2 py-2 bg-slate-50/70 border border-slate-200/80 rounded-xl text-sm text-center focus:ring-2 focus:ring-[#F9DAD9] outline-none">
                <button type="button" onclick="hapusBaris(this)" class="text-rose-400 hover:text-rose-600 p-1 text-xs font-bold">✕</button>
            `;
            container.appendChild(newRow);
            perbaruiNomorUrut();
        }

        function hapusBaris(button) {
            button.parentElement.remove();
            perbaruiNomorUrut();
        }

        function perbaruiNomorUrut() {
            const rows = document.querySelectorAll('#itemContainer .item-row');
            rows.forEach((row, index) => {
                row.querySelector('span').innerText = (index + 1) + '.';
            });
        }

        function submitATK() {
            const nama = document.getElementById('namaPeminta').value.trim();
            const email = document.getElementById('emailPeminta').value.trim();
            const departemen = document.getElementById('departemen').value.trim();
            const noReservasi = document.getElementById('noReservasi').value.trim();
            const tglReservasi = document.getElementById('tglReservasi').value;

            if (!nama || !email || !departemen || !noReservasi || !tglReservasi) {
                alert('Mohon lengkapi seluruh data peminta, departemen, dan nomor reservasi!');
                return;
            }

            const rowItems = document.querySelectorAll('#itemContainer .item-row');
            let itemsArray = [];

            rowItems.forEach((row) => {
                const midBarang = row.querySelector('.mid-barang').value.trim();
                const namaBarang = row.querySelector('.nama-barang').value.trim();
                const uomBarang = row.querySelector('.uom-barang').value.trim();
                const qty = row.querySelector('.qty-barang').value;

                if (namaBarang || midBarang) {
                    itemsArray.push({
                        mid: midBarang || '-',
                        namaBarang: namaBarang || "Barang Manual",
                        uom: uomBarang || '-',
                        qty: parseInt(qty) || 1
                    });
                }
            });

            if (itemsArray.length === 0) {
                alert('Masukkan minimal 1 barang ATK yang ingin direservasi!');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Menyimpan...';

            const payload = {
                namaPeminta: nama,
                emailPeminta: email,
                departemen: departemen,
                noReservasi: noReservasi,
                tglReservasi: tglReservasi,
                items: itemsArray
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(result => {
                if (result.status === "success") {
                    // Sembunyikan Form Utama
                    document.getElementById('atkForm').classList.add('hidden');
                    
                    // Render Data Ringkasan ke UI
                    document.getElementById('sumNoReservasi').innerText = noReservasi;
                    document.getElementById('sumNama').innerText = nama;
                    document.getElementById('sumDeptEmail').innerText = `${departemen} (${email})`;
                    document.getElementById('sumTgl').innerText = tglReservasi;

                    let itemsHtml = '';
                    itemsArray.forEach((item, index) => {
                        itemsHtml += `
                            <div class="flex justify-between items-center p-3 bg-white">
                                <div>
                                    <p class="font-medium text-slate-800">${index + 1}. ${item.namaBarang}</p>
                                    <p class="text-xs text-slate-400">MID: ${item.mid}</p>
                                </div>
                                <span class="bg-[#F9DAD9]/40 text-rose-700 font-bold text-xs px-2.5 py-1 rounded-lg border border-[#F9DAD9]">
                                    ${item.qty} ${item.uom !== '-' ? item.uom : ''}
                                </span>
                            </div>
                        `;
                    });
                    document.getElementById('sumItemsContainer').innerHTML = itemsHtml;

                    // Tampilkan Rincian Sukses
                    document.getElementById('successSummary').classList.remove('hidden');
                } else {
                    alert('Gagal menyimpan: ' + result.message);
                    btn.disabled = false;
                    btn.innerText = 'Kirim Reservasi';
                }
            })
            .catch((error) => {
                alert('Terjadi kesalahan koneksi ke server: ' + error);
                btn.disabled = false;
                btn.innerText = 'Kirim Reservasi';
            });
        }
    </script>
</body>
</html>
